<title>/*TITLE*/</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
  :root {
    --bg: #eef1f2; --surface: #ffffff; --ink: #1c2226; --muted: #5d6a71; --line: #d5dcdf;
    --accent: #2b5d8a; --accent-soft: #dce8f2;
    --mark: #c2410c; --mark-bg: #fde4d4; --changed: #e7f1e9; --changed-line: #3f8a5a;
    --del-bg: #fff5f5; --del-strong: #ffc9c9; --ins-bg: #f2fbf4; --ins-strong: #b9eac6;
    --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
    --sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #14181b; --surface: #1b2125; --ink: #e3e8ea; --muted: #94a2a9; --line: #2e373c;
      --accent: #80b1dc; --accent-soft: #22313d; --mark: #f29a64; --mark-bg: #4a2a1b; --changed: #1f3227; --changed-line: #6cc08d;
      --del-bg: #2a1c1d; --del-strong: #6b2d31; --ins-bg: #17271d; --ins-strong: #245c37;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14181b; --surface: #1b2125; --ink: #e3e8ea; --muted: #94a2a9; --line: #2e373c;
    --accent: #80b1dc; --accent-soft: #22313d; --mark: #f29a64; --mark-bg: #4a2a1b; --changed: #1f3227; --changed-line: #6cc08d;
      --del-bg: #2a1c1d; --del-strong: #6b2d31; --ins-bg: #17271d; --ins-strong: #245c37;
  }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; }
  .wrap { padding-inline: 16px; padding-block: 0 140px; max-width: 1240px; margin-inline: auto; }
  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-block: 12px;
  }
  header.top h1 { font-size: 16px; margin: 0; font-weight: 700; }
  .ver { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .spacer { flex: 1; }
  .switch { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .switch input { accent-color: var(--changed-line); width: 16px; height: 16px; }

  .layout { display: grid; gap: 24px; grid-template-columns: 1fr; padding-top: 16px; }
  @media (min-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr) 320px; } }

  .paper { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding-block: 28px 40px; padding-inline: clamp(18px, 5vw, 56px); }
  .hint { font-size: 13px; color: var(--muted); margin: 0 0 18px; line-height: 1.7; }
  article { font-family: var(--serif); font-size: 17px; line-height: 1.95; max-width: 36em; margin-inline: auto; }
  article .blk { margin: 0 0 1em; white-space: pre-wrap; border-radius: 3px; }
  article .h1 { font-size: 26px; line-height: 1.45; font-weight: 600; margin-bottom: 22px; text-wrap: balance; }
  article .h2 { font-size: 20px; font-weight: 600; margin-top: 30px; text-wrap: balance; }
  article .h3 { font-size: 17px; font-weight: 600; margin-top: 24px; }
  article .hr { border-top: 1px solid var(--line); height: 0; margin: 28px 0; }
  article .list { font-size: 15.5px; }
  .lnk { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .mk { background: var(--mark-bg); text-decoration: line-through; text-decoration-color: var(--mark); text-decoration-thickness: 1.5px; cursor: pointer; border-radius: 2px; }
  .mk.focus { outline: 2px solid var(--mark); outline-offset: 1px; }
  article .blk.was-changed { border-left: 3px solid var(--changed-line); padding-left: 10px; margin-left: -13px; }

  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .tabs button { font-size: 13px; padding: 6px 14px; border: 0; background: var(--surface); color: var(--muted); }
  .tabs button + button { border-left: 1px solid var(--line); }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--surface); }
  .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .cmp { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .cmp-head, .cmp-row { display: grid; grid-template-columns: 1fr 1fr; }
  .cmp-head div { font-size: 12.5px; font-weight: 500; color: var(--muted); padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .cmp-head div + div, .cmp-row .side + .side { border-left: 1px solid var(--line); }
  .cmp-row { border-bottom: 1px solid var(--line); }
  .cmp-row:last-child { border-bottom: 0; }
  .side { font-family: var(--serif); font-size: 15.5px; line-height: 1.9; padding: 12px 16px; white-space: pre-wrap; min-width: 0; overflow-wrap: anywhere; }
  .side .para + .para { margin-top: 0.8em; }
  .side.old { background: var(--del-bg); }
  .side.new { background: var(--ins-bg); }
  .side .h { font-weight: 600; }
  .side .gone { color: var(--muted); font-family: var(--sans); font-size: 13px; font-style: italic; }
  .del { background: var(--del-strong); border-radius: 2px; }
  .ins { background: var(--ins-strong); border-radius: 2px; }
  .struck { text-decoration: line-through; text-decoration-color: var(--mark); text-decoration-thickness: 2px; }
  .why { grid-column: 1 / -1; font-family: var(--sans); font-size: 12.5px; color: var(--muted); padding: 8px 16px; border-top: 1px dashed var(--line); line-height: 1.7; }
  .why b { color: var(--mark); font-weight: 500; }
  .fold { grid-column: 1 / -1; text-align: center; }
  .fold button { width: 100%; border: 0; background: var(--bg); color: var(--muted); font-size: 12.5px; padding: 7px; }
  .fold button:hover { color: var(--accent); }
  .same .side { color: var(--muted); font-size: 14.5px; }
  .cmp-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); margin: 0 0 12px; }
  .cmp-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cmp-legend i { display: inline-block; width: 22px; height: 12px; border-radius: 2px; }
  @media (max-width: 760px) {
    .cmp-head { display: none; }
    .cmp-row { grid-template-columns: 1fr; }
    .cmp-row .side + .side { border-left: 0; border-top: 1px solid var(--line); }
    .side::before { display: block; font-family: var(--sans); font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
    .side.old::before { content: "上一版"; }
    .side.new::before { content: "这一版"; }
  }

  aside { align-self: start; }
  @media (min-width: 1000px) { aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); max-height: calc(100vh - 80px); overflow: auto; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
  .card h2 { font-size: 14px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 span { font-family: var(--mono); font-size: 12px; color: var(--muted); font-weight: 400; }
  .list-marks { display: grid; gap: 10px; margin: 0 0 14px; padding: 0; list-style: none; }
  .list-marks li { border-left: 3px solid var(--mark); padding: 2px 0 2px 10px; font-size: 13px; line-height: 1.6; }
  .list-marks li.focus { background: var(--mark-bg); }
  .list-marks .q { font-family: var(--serif); cursor: pointer; }
  .list-marks .row { display: flex; gap: 6px; margin-top: 4px; }
  .list-marks input { flex: 1; min-width: 0; font: inherit; font-size: 12.5px; padding: 4px 7px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); color: var(--ink); }
  .empty { font-size: 13px; color: var(--muted); line-height: 1.7; }
  button { font-family: var(--sans); cursor: pointer; }
  .btn { font-size: 14px; padding: 8px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); width: 100%; }
  .btn.danger { background: var(--mark); border-color: var(--mark); color: #fff; }
  .btn.small { font-size: 12px; padding: 3px 8px; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { font-size: 12.5px; color: var(--muted); margin-top: 8px; line-height: 1.6; }

  .selbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line);
    box-shadow: 0 -8px 24px rgba(20, 30, 40, 0.12); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .selbar .inner { max-width: 1240px; margin-inline: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .selbar .q { flex: 1 1 100%; font-family: var(--serif); font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .selbar input { flex: 1 1 220px; min-width: 0; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); }
</style>

<div class="wrap">
  <header class="top">
    <h1 id="title"></h1>
    <span class="ver" id="ver"></span>
    <span class="spacer"></span>
    <div class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" id="tabMark" aria-selected="true">划线</button>
      <button type="button" role="tab" id="tabCmp" aria-selected="false">对比上一版</button>
    </div>
  </header>

  <div class="layout">
    <main>
      <section id="cmpView" hidden>
        <div class="cmp-legend" aria-hidden="true">
          <span><i style="background:var(--del-strong)"></i>上一版里删掉的字</span>
          <span><i style="background:var(--ins-strong)"></i>这一版新写的字</span>
          <span><i style="border-bottom:2px solid var(--mark)"></i>你划掉的地方</span>
        </div>
        <div class="cmp" id="cmp"></div>
      </section>
      <div class="paper" id="paper">
        <p class="hint">用鼠标或手指选中不喜欢的句子或词，屏幕底部会出现「划掉」按钮，可以顺手写一句原因（不写也行）。点划过的地方可以在右侧撤销或改原因。划完点「全部提交」。</p>
        <article id="article"></article>
      </div>
    </main>
    <aside>
      <div class="card">
        <h2>这一轮划掉的 <span id="count">0 处</span></h2>
        <ul class="list-marks" id="marks"></ul>
        <p class="empty" id="emptyNote">还没有划线。</p>
        <button type="button" class="btn primary" id="submit">全部提交，交给 Gemini 重写</button>
        <p class="status" id="status"></p>
      </div>
    </aside>
  </div>
</div>

<div class="selbar" id="selbar" hidden>
  <div class="inner">
    <div class="q" id="selQuote"></div>
    <input id="selReason" placeholder="原因（可不写）：比如 太像 AI、太书面、不像我会说的话">
    <button type="button" class="btn danger" id="selMark">划掉</button>
    <button type="button" class="btn" id="selCancel">取消</button>
  </div>
</div>

<script>
(() => {
  const DATA = /*DATA*/null;
  const V = DATA.version;
  const $ = (id) => document.getElementById(id);
  let marks = [];            // {id, v, p, start, end, quote, reason}
  let db = null, writable = true, pending = null, focusId = null;
  const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const LSKEY = `markup:${DATA.key}:v${V}`;

  $("title").textContent = DATA.title;
  $("ver").textContent = `第 ${V} 版${DATA.model ? " · " + DATA.model : ""}`;
  if (!DATA.prevBlocks.length) $("tabs").hidden = true;

  function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

  function renderArticle() {
    const art = $("article");
    art.innerHTML = "";
    const changedSet = new Set(DATA.changes.flatMap((c) => c.newBlocks));
    DATA.blocks.forEach((b) => {
      const el = document.createElement("div");
      el.className = `blk ${b.kind}` + (changedSet.has(b.p) ? " was-changed" : "");
      el.dataset.p = b.p;
      if (b.kind === "hr") { art.append(el); return; }
      // per character: which mark (if any) and which link (if any) covers it, then emit runs
      const n = b.text.length, mk = new Array(n).fill(null), ln = new Array(n).fill(null);
      marks.filter((m) => m.p === b.p).forEach((m) => { for (let k = m.start; k < Math.min(m.end, n); k++) mk[k] = m.id; });
      (b.links || []).forEach(([s0, e0, url]) => { for (let k = s0; k < Math.min(e0, n); k++) ln[k] = url; });
      let html = "", k = 0;
      while (k < n) {
        let e = k + 1;
        while (e < n && mk[e] === mk[k] && ln[e] === ln[k]) e++;
        let piece = esc(b.text.slice(k, e));
        if (ln[k]) piece = `<span class="lnk" title="${esc(ln[k])}">${piece}</span>`;
        if (mk[k]) piece = `<span class="mk${mk[k] === focusId ? " focus" : ""}" data-id="${mk[k]}">${piece}</span>`;
        html += piece;
        k = e;
      }
      el.innerHTML = html;
      art.append(el);
    });
  }

  function renderList() {
    const ul = $("marks");
    ul.innerHTML = "";
    const sorted = [...marks].sort((a, b) => a.p - b.p || a.start - b.start);
    sorted.forEach((m) => {
      const li = document.createElement("li");
      li.className = m.id === focusId ? "focus" : "";
      li.innerHTML = `<div class="q"></div><div class="row"><input aria-label="原因" placeholder="原因（可不写）"><button type="button" class="btn small">撤销</button></div>`;
      li.querySelector(".q").textContent = "「" + m.quote + "」";
      li.querySelector(".q").addEventListener("click", () => focusMark(m.id, true));
      const inp = li.querySelector("input");
      inp.id = "reason-" + m.id;
      inp.value = m.reason || "";
      let t = null;
      inp.addEventListener("input", () => { m.reason = inp.value; clearTimeout(t); t = setTimeout(() => persist(m), 600); });
      li.querySelector("button").addEventListener("click", () => removeMark(m.id));
      ul.append(li);
    });
    $("count").textContent = `${marks.length} 处`;
    $("emptyNote").hidden = marks.length > 0;
  }

  function render() { renderArticle(); renderList(); }

  function focusMark(id, scroll) {
    focusId = id; render();
    if (scroll) document.querySelector(`.mk[data-id="${id}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" });
    else document.getElementById("reason-" + id)?.scrollIntoView({ block: "nearest" });
  }

  function offsetIn(blockEl, node, off) {
    const r = document.createRange();
    r.setStart(blockEl, 0);
    r.setEnd(node, off);
    return r.toString().length;
  }

  function readSelection() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
    const range = sel.getRangeAt(0);
    const art = $("article");
    if ($("paper").hidden || !art.contains(range.commonAncestorContainer)) return null;
    const parts = [];
    art.querySelectorAll(".blk").forEach((el) => {
      if (!range.intersectsNode(el) || el.classList.contains("hr")) return;
      const p = Number(el.dataset.p), text = DATA.blocks.find((b) => b.p === p).text;
      const start = el.contains(range.startContainer) ? offsetIn(el, range.startContainer, range.startOffset) : 0;
      const end = el.contains(range.endContainer) ? offsetIn(el, range.endContainer, range.endOffset) : text.length;
      let s = start, e = end;
      while (s < e && /\s/.test(text[s])) s++;
      while (e > s && /\s/.test(text[e - 1])) e--;
      if (e > s) parts.push({ p, start: s, end: e, quote: text.slice(s, e) });
    });
    return parts.length ? parts : null;
  }

  function onSelect() {
    const parts = readSelection();
    if (!parts) { if (!$("selReason").matches(":focus")) { pending = null; $("selbar").hidden = true; } return; }
    pending = parts;
    $("selQuote").textContent = "选中：「" + parts.map((x) => x.quote).join(" … ") + "」";
    $("selbar").hidden = false;
  }

  async function persist(m) {
    ls.set(LSKEY, JSON.stringify(marks));
    if (!db || !writable) return;
    try {
      await db.doc("marks/" + m.id).set({ v: V, p: m.p, start: m.start, end: m.end, quote: m.quote, reason: m.reason || "", ts: new Date().toISOString() });
      $("status").textContent = "已保存";
    } catch (e) {
      if (e && e.code === "invalid_argument") { writable = false; $("status").textContent = "这个页面上你没有保存权限，划线只存在这台设备上。"; }
      else $("status").textContent = "这一条没存上，网络恢复后改一下原因会再存一次。";
    }
  }

  async function removeMark(id) {
    marks = marks.filter((m) => m.id !== id);
    if (focusId === id) focusId = null;
    render();
    ls.set(LSKEY, JSON.stringify(marks));
    if (db && writable) { try { await db.doc("marks/" + id).delete(); } catch {} }
  }

  function addPending() {
    if (!pending) return;
    const reason = $("selReason").value.trim();
    const added = pending.map((x) => ({ id: "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), v: V, ...x, reason }));
    marks.push(...added);
    pending = null; $("selReason").value = ""; $("selbar").hidden = true;
    window.getSelection()?.removeAllRanges();
    render();
    added.forEach(persist);
  }

  $("selMark").addEventListener("click", addPending);
  $("selReason").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addPending(); } });
  $("selCancel").addEventListener("click", () => { pending = null; $("selbar").hidden = true; window.getSelection()?.removeAllRanges(); });
  document.addEventListener("selectionchange", () => { clearTimeout(onSelect.t); onSelect.t = setTimeout(onSelect, 120); });
  $("article").addEventListener("click", (e) => {
    const mk = e.target.closest(".mk");
    if (mk && window.getSelection()?.isCollapsed) focusMark(mk.dataset.id, false);
  });
  // ---------- side-by-side comparison with the previous version
  function tokens(t) { return t.match(/[A-Za-z0-9.+\-]+|\s+|[\s\S]/g) || []; }
  function diff(a, b) {            // token LCS -> flags of changed chars on each side
    const A = tokens(a), B = tokens(b), n = A.length, m = B.length;
    const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const del = [], ins = [];
    let i = 0, j = 0;
    while (i < n || j < m) {
      if (i < n && j < m && A[i] === B[j]) { for (const _ of A[i]) { del.push(0); } for (const _ of B[j]) { ins.push(0); } i++; j++; }
      else if (j < m && (i === n || L[i][j + 1] >= L[i + 1][j])) { for (const _ of B[j]) ins.push(1); j++; }
      else { for (const _ of A[i]) del.push(1); i++; }
    }
    return { del, ins };
  }
  function paint(text, layers) {   // layers: [{flags, cls}] -> html with runs of identical flags
    const chars = [...text];
    let html = "", run = "", key = "";
    const flush = () => { if (!run) return; const cls = key.split(" ").filter(Boolean).join(" "); html += cls ? `<span class="${cls}">${esc(run)}</span>` : esc(run); run = ""; };
    chars.forEach((ch, k) => {
      const kk = layers.filter((l) => l.flags[k]).map((l) => l.cls).join(" ");
      if (kk !== key) { flush(); key = kk; }
      run += ch;
    });
    flush();
    return html;
  }
  function struckFlags(text, quotes) {
    const f = new Array([...text].length).fill(0);
    quotes.forEach((q) => {
      const at = text.indexOf(q);
      if (at < 0) return;
      const s0 = [...text.slice(0, at)].length, len = [...q].length;
      for (let k = s0; k < s0 + len; k++) f[k] = 1;
    });
    return f;
  }
  function blockHtml(b, inner) { return `<div class="para${b.kind.startsWith("h") ? " h" : ""}">${inner}</div>`; }

  function renderCompare() {
    const box = $("cmp");
    box.innerHTML = `<div class="cmp-head"><div>上一版（第 ${V - 1} 版）</div><div>这一版（第 ${V} 版）</div></div>`;
    const prev = DATA.prevBlocks, cur = DATA.blocks;
    const chs = [...DATA.changes].sort((x, y) => x.oldP[0] - y.oldP[0]);
    const rows = [];
    let i = 0, j = 0;
    const same = () => { const r = { same: [] }; rows.push(r); return r; };
    let bucket = null;
    const pushSame = (a, b) => { if (!bucket) bucket = same(); bucket.same.push([a, b]); };
    chs.forEach((c) => {
      while (i < c.oldP[0]) { pushSame(prev[i], cur[j]); i++; j++; }
      bucket = null;
      rows.push({ c, old: c.oldP.map((p) => prev[p]), neu: c.newBlocks.map((p) => cur[p]) });
      i = c.oldP[c.oldP.length - 1] + 1;
      j = c.newBlocks.length ? c.newBlocks[c.newBlocks.length - 1] + 1 : j;
    });
    while (i < prev.length || j < cur.length) { pushSame(prev[i], cur[j]); i++; j++; }

    rows.forEach((r) => {
      if (r.same) {
        const real = r.same.filter(([a, b]) => (a && a.kind !== "hr") || (b && b.kind !== "hr"));
        if (!real.length) return;
        const wrap = document.createElement("div");
        wrap.className = "cmp-row same";
        wrap.innerHTML = `<div class="fold"><button type="button">… ${real.length} 段没有改动，点开查看 …</button></div>`;
        wrap.querySelector("button").addEventListener("click", () => {
          wrap.innerHTML = `<div class="side old">${real.map(([a]) => a ? blockHtml(a, esc(a.text)) : "").join("")}</div><div class="side new">${real.map(([, b]) => b ? blockHtml(b, esc(b.text)) : "").join("")}</div>`;
        });
        box.append(wrap);
        return;
      }
      const oldText = r.old.map((b) => b.text).join("\n\n"), newText = r.neu.map((b) => b.text).join("\n\n");
      const { del, ins } = diff(oldText, newText);
      const struck = struckFlags(oldText, r.c.marks.map((m) => m.quote));
      const row = document.createElement("div");
      row.className = "cmp-row";
      const oldHtml = paint(oldText, [{ flags: del, cls: "del" }, { flags: struck, cls: "struck" }]);
      const newHtml = newText ? paint(newText, [{ flags: ins, cls: "ins" }]) : `<span class="gone">（整段删掉了）</span>`;
      row.innerHTML = `<div class="side old">${oldHtml}</div><div class="side new">${newHtml}</div>` +
        (r.c.marks.length ? `<div class="why">你划掉的：${r.c.marks.map((m) => "<b>「" + esc(m.quote) + "」</b>" + (m.reason ? "：" + esc(m.reason) : "")).join("；")}</div>` : "");
      box.append(row);
    });
  }

  function setTab(cmp) {
    $("tabMark").setAttribute("aria-selected", String(!cmp));
    $("tabCmp").setAttribute("aria-selected", String(cmp));
    $("cmpView").hidden = !cmp;
    $("paper").hidden = cmp;
    if (cmp) { renderCompare(); $("selbar").hidden = true; }
    ls.set("markup:tab", cmp ? "cmp" : "mark");
  }
  $("tabMark").addEventListener("click", () => setTab(false));
  $("tabCmp").addEventListener("click", () => setTab(true));

  $("submit").addEventListener("click", async () => {
    if (!marks.length) { $("status").textContent = "还没有划线，先选中不喜欢的句子。"; return; }
    if (!db || !writable) { $("status").textContent = "这个视图存不了提交记录。把这一轮的划线截个图发给 Claude 也可以。"; return; }
    $("submit").disabled = true;
    try {
      await Promise.all(marks.map((m) => db.doc("marks/" + m.id).set({ v: V, p: m.p, start: m.start, end: m.end, quote: m.quote, reason: m.reason || "", ts: new Date().toISOString() })));
      await db.doc("state/submitted").set({ v: V, count: marks.length, at: new Date().toISOString() });
      $("status").textContent = `第 ${V} 版的 ${marks.length} 处划线已提交。回到对话跟 Claude 说一声，它会让 Gemini 重写这些段落，然后更新这个页面。`;
    } catch (e) {
      $("status").textContent = "提交没成功，再点一次试试。";
    }
    $("submit").disabled = false;
  });

  try { marks = (JSON.parse(ls.get(LSKEY) || "[]") || []).filter((m) => m.v === V); } catch { marks = []; }
  render();
  if (DATA.prevBlocks.length) setTab(ls.get("markup:tab") !== "mark");

  (async () => {
    db = window.claude?.use ? await window.claude.use("db") : null;
    if (!db) { $("status").textContent = "这个视图连不上存储，划线只存在这台设备上。"; return; }
    try {
      const snap = await db.collection("marks").get();
      const stored = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((m) => m.v === V);
      const byId = new Map(stored.map((m) => [m.id, m]));
      marks.forEach((m) => { if (!byId.has(m.id)) { byId.set(m.id, m); persist(m); } });
      marks = [...byId.values()];
      const st = await db.doc("state/submitted").get();
      if (st.exists && st.data().v === V) $("status").textContent = `第 ${V} 版已提交过 ${st.data().count} 处。还可以继续划，再点一次提交。`;
      render();
    } catch { /* keep local marks */ }
  })();
})();
</script>
